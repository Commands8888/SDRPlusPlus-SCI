name: Build SDRPP-FULL Linux packages

# Lightweight Linux release path for SDRPP-FULL .deb and AppImage downloads.
#
# Calls the same reusable builders as Build Binaries. On every master update,
# upload the Linux builds to João's existing stable release; manual runs keep artifacts.

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.read.outputs.version }}
            version_full: ${{ steps.read.outputs.version_full }}
        steps:
        - uses: actions/checkout@v5
          with:
            # Full history: get_version.sh derives the version from git describe.
            fetch-depth: 0

        - name: Read version
          id: read
          run: |
            eval "$(scripts/get_version.sh "$GITHUB_WORKSPACE")"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "version_full=$VERSION_FULL" >> $GITHUB_OUTPUT

    build_deb:
        needs: [prepare]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - base_image: debian:bookworm
                      suffix: debian-bookworm-amd64
                      filename_suffix: -debian-bookworm-amd64
                      volk_package: libvolk2-dev
                      curl_source: bundled
                    - base_image: debian:trixie
                      suffix: debian-trixie-amd64
                      filename_suffix: -debian-trixie-amd64
                      volk_package: libvolk-dev
                      curl_source: system
                    - base_image: ubuntu:jammy
                      suffix: ubuntu-jammy-amd64
                      filename_suffix: -ubuntu-jammy-amd64
                      volk_package: libvolk2-dev
                      curl_source: bundled
                    - base_image: ubuntu:noble
                      suffix: ubuntu-noble-amd64
                      filename_suffix: ''
                      volk_package: libvolk-dev
                      curl_source: system
                    - base_image: ubuntu:resolute
                      suffix: ubuntu-resolute-amd64
                      filename_suffix: -ubuntu-resolute-amd64
                      volk_package: libvolk-dev
                      curl_source: system
        uses: ./.github/workflows/build_linux.yml
        with:
            base_image: ${{ matrix.base_image }}
            runner: ubuntu-latest
            artifact: SDRPP-FULL-v${{ needs.prepare.outputs.version }}${{ matrix.filename_suffix }}
            volk_package: ${{ matrix.volk_package }}
            extra_apt: ''
            curl_source: ${{ matrix.curl_source }}
            version_full: ${{ needs.prepare.outputs.version_full }}
            build_dsd: true

    # Portable option with an isolated config directory.
    build_appimage:
        needs: [prepare]
        uses: ./.github/workflows/build_appimage.yml
        with:
            runner: ubuntu-latest
            arch: x86_64
            artifact: SDRPP-FULL-v${{ needs.prepare.outputs.version }}-linux-x86_64
            version_full: ${{ needs.prepare.outputs.version_full }}

    publish_release:
        needs: [prepare, build_deb, build_appimage]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: read
        steps:
            - uses: actions/download-artifact@v7
              with:
                  path: packages
                  pattern: SDRPP-FULL-v${{ needs.prepare.outputs.version }}*
                  merge-multiple: true

            - name: Publish Linux downloads to the existing release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VER: ${{ needs.prepare.outputs.version }}
              run: |
                  set -euo pipefail
                  gh release view Realease --repo "$GITHUB_REPOSITORY" >/dev/null
                  gh release upload Realease packages/* --repo "$GITHUB_REPOSITORY" --clobber
                  # Keep the release tag aligned with the commit that built its newest files.
                  gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/Realease" \
                      -f sha="$GITHUB_SHA" -F force=true >/dev/null
                  # Update only the summary line; preserve João's release notes.
                  old_notes=$(gh release view Realease --repo "$GITHUB_REPOSITORY" --json body --jq .body)
                  summary="SDRPP-FULL v${VER} Linux (DSD + oldDSD); commit $GITHUB_SHA"
                  if [[ "$old_notes" == *$'\n'* ]]; then
                      gh release edit Realease --repo "$GITHUB_REPOSITORY" \
                          --notes "${summary}"$'\n'"${old_notes#*$'\n'}"
                  else
                      gh release edit Realease --repo "$GITHUB_REPOSITORY" --notes "$summary"
                  fi
                  # Preserve older working packages for rollback.
                  if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                  fi
